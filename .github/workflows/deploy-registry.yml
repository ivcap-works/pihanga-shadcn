name: Deploy Registry to GitHub Pages

# Builds the Vite playground (which copies public/r/ registry JSON into dist/)
# and deploys to GitHub Pages.
#
# Trigger: push to main/master OR a version tag (v*.*.*).
# Tag deploys also populate a versioned sub-path for stable consumer URLs:
#   https://ivcap-works.github.io/pihanga-shadcn/v1.2.0/r/button
#
# Required GitHub setting:  Settings → Pages → Source: "GitHub Actions"

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Cancel in-progress deploys on the same ref so newer pushes win.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Determine the base URL for registry item cross-references.
      #   Tag push  → https://ivcap-works.github.io/pihanga-shadcn/<tag>
      #   Branch    → https://ivcap-works.github.io/pihanga-shadcn
      - name: Resolve registry base URL
        id: registry_url
        run: |
          PAGES_BASE="https://ivcap-works.github.io/pihanga-shadcn"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "base_url=${PAGES_BASE}/${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${PAGES_BASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate registry JSON (public/r/)
        run: node scripts/gen-registry.mjs --base-url "${{ steps.registry_url.outputs.base_url }}"

      # For tag deploys: also regenerate with the un-versioned URL so the
      # "latest" path at /r/ continues to work after the versioned copy replaces it.
      - name: Save un-versioned registry copy (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p public/latest-r
          node scripts/gen-registry.mjs --base-url "https://ivcap-works.github.io/pihanga-shadcn"
          cp public/r/*.json public/latest-r/

      # Vite copies public/ verbatim into dist/; public/r/*.json lands at dist/r/
      - name: Vite build
        run: yarn build
        env:
          NODE_ENV: production

      # Copy the versioned registry into dist/<tag>/r/ for pinned consumer URLs
      - name: Copy versioned registry into dist (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p "dist/${TAG}/r"
          cp public/r/*.json "dist/${TAG}/r/"
          cp public/latest-r/*.json dist/r/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
