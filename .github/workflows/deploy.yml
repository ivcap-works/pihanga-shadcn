name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Determine the base URL for registry item cross-references.
      #   Tag push  → https://ivcap-works.github.io/pihanga-shadcn/<tag>
      #   Branch    → https://ivcap-works.github.io/pihanga-shadcn
      - name: Resolve registry base URL
        id: registry_url
        run: |
          PAGES_BASE="https://ivcap-works.github.io/pihanga-shadcn"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "base_url=${PAGES_BASE}/${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${PAGES_BASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate registry JSON (public/r/)
        run: node scripts/gen-registry.mjs --base-url "${{ steps.registry_url.outputs.base_url }}"

      # For tag deploys: also regenerate with the un-versioned URL so the
      # "latest" path at /r/ continues to work after the versioned copy replaces it.
      - name: Save un-versioned registry copy (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p public/latest-r
          node scripts/gen-registry.mjs --base-url "https://ivcap-works.github.io/pihanga-shadcn"
          cp public/r/*.json public/latest-r/

      - name: Build
        run: |
          yarn tsc -b
          yarn vite build --base=/pihanga-shadcn/
        env:
          NODE_ENV: production

      # USER_GUIDE.md lives in the repo root (for visibility) and must be
      # served at /pihanga-shadcn/USER_GUIDE.md on GitHub Pages.
      # The Vite rootFilePlugin emits it in local builds; this step is the
      # authoritative source for CI so the file is always present in dist/.
      - name: Copy USER_GUIDE.md into dist
        run: cp USER_GUIDE.md dist/USER_GUIDE.md

      # Copy the versioned registry into dist/<tag>/r/ for pinned consumer URLs
      - name: Copy versioned registry into dist (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p "dist/${TAG}/r"
          cp public/r/*.json "dist/${TAG}/r/"
          cp public/latest-r/*.json dist/r/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
